name: Build and deploy environment-monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run Deploy Job?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    environment: Production
    permissions:
      id-token: write
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ">=20.0.0"

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Install LocalDB
      - name: Install LocalDB
        uses: potatoqualitee/mssqlsuite@v1.8
        with:
          install: localdb

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Run Integration Tests
        run: |
          dotnet test tests/EnvironmentMonitor.Tests/EnvironmentMonitor.Tests.csproj

      - name: Run Unit Tests
        run: |
          dotnet test tests/EnvironmentMonitor.UnitTests/EnvironmentMonitor.UnitTests.csproj

      - name: Install dependencies for React UI
        run: |
          cd src/EnvironmentMonitor.ReactUi/environment-monitor
          npm install

      - name: Build React UI (Vite)
        run: |
          cd src/EnvironmentMonitor.ReactUi/environment-monitor
          npm run build

      - name: Copy Vite build to .NET wwwroot
        run: |
          cp -r src/EnvironmentMonitor.ReactUi/environment-monitor/dist/ src/EnvironmentMonitor.WebApi/wwwroot/

      - name: Publish WEB API (WIN-X86, WIN-X64, LINUX-X64)
        run: |
          dotnet publish src/EnvironmentMonitor.WebApi/EnvironmentMonitor.WebApi.csproj -c Release -r win-x86 -o "${{env.DOTNET_ROOT}}/env-monitor-web-api_x86"
          dotnet publish src/EnvironmentMonitor.WebApi/EnvironmentMonitor.WebApi.csproj -c Release -r win-x64 -o "${{env.DOTNET_ROOT}}/env-monitor-web-api_x64"
          dotnet publish src/EnvironmentMonitor.WebApi/EnvironmentMonitor.WebApi.csproj -c Release -r linux-x64 -o "${{env.DOTNET_ROOT}}/env-monitor-web-api_linux-x64"

      - name: Publish Function app (WIN-X86, WIN-X64, LINUX-X64)
        run: |
          dotnet publish src/EnvironmentMonitor.HubObserver/EnvironmentMonitor.HubObserver.csproj -c Release -r win-x86 -o "${{env.DOTNET_ROOT}}/env-monitor-function_x86"
          dotnet publish src/EnvironmentMonitor.HubObserver/EnvironmentMonitor.HubObserver.csproj -c Release -r win-x64 -o "${{env.DOTNET_ROOT}}/env-monitor-function_x64"
          dotnet publish src/EnvironmentMonitor.HubObserver/EnvironmentMonitor.HubObserver.csproj -c Release -r linux-x64 -o "${{env.DOTNET_ROOT}}/env-monitor-function_linux-x64"

      - name: Publish Worker (LINUX-X64)
        run: |
          dotnet publish src/EnvironmentMonitor.Worker/EnvironmentMonitor.Worker.csproj -c Release -r linux-x64 -o "${{env.DOTNET_ROOT}}/env-monitor-worker_linux-x64"

      - name: Zip x64 applications
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packages -Force | Out-Null
          $applications = @(
            'env-monitor-web-api_x64',
            'env-monitor-web-api_linux-x64',
            'env-monitor-function_x64',
            'env-monitor-function_linux-x64',
            'env-monitor-worker_linux-x64'
          )
          foreach ($application in $applications) {
            $source = Join-Path $env:DOTNET_ROOT $application
            $destination = Join-Path $PWD "packages/$application.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory($source, $destination)
            $archive = [System.IO.Compression.ZipFile]::OpenRead($destination)
            try {
              Write-Output "::group::Contents of $application.zip"
              $files = @($archive.Entries | Where-Object { $_.Name -ne '' })
              if ($files.Count -eq 0) {
                throw "Archive $application.zip contains no files."
              }
              foreach ($file in $files) {
                Write-Output ("{0} ({1:N0} bytes)" -f $file.FullName, $file.Length)
              }
              $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
              $zipBytes = (Get-Item -LiteralPath $destination).Length
              $summary = "${application}.zip: $($files.Count) files, $totalBytes uncompressed bytes, $zipBytes ZIP bytes"
              Write-Output $summary
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- $summary"
            }
            finally {
              $archive.Dispose()
              Write-Output '::endgroup::'
            }
          }

      - name: Upload web api artifact (linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: .env-monitor-web-api_linux-x64
          path: ${{env.DOTNET_ROOT}}/env-monitor-web-api_linux-x64

      - name: Upload function artifact (win-x86)
        uses: actions/upload-artifact@v4
        with:
          name: .env-monitor-function_x86
          path: ${{env.DOTNET_ROOT}}/env-monitor-function_x86
          include-hidden-files: true

      - name: Upload function artifact (win-x64)
        uses: actions/upload-artifact@v4
        with:
          name: .env-monitor-function_x64
          path: ${{env.DOTNET_ROOT}}/env-monitor-function_x64
          include-hidden-files: true

      - name: Upload worker artifact (linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: .env-monitor-worker_linux-x64
          path: ${{env.DOTNET_ROOT}}/env-monitor-worker_linux-x64

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C8625311A7E41DF94B1F493E439AE3D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A9F03B52F6CA485B82924F1970E00D80 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4CE7A1599994A388FDDA5640CED3ECE }}

      - name: Upload applications to Azure Blob Storage
        shell: bash
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          source_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$source_branch" == "main" ]]; then
            destination_path="$source_branch/$GITHUB_RUN_ID"
          else
            destination_path="branches/$source_branch/$GITHUB_RUN_ID"
          fi
          echo "Container: environment-monitor"
          echo "Destination path: $destination_path"
          echo "ZIP files to upload:"
          ls -lh packages/*.zip

          az storage blob upload-batch \
            --account-name "$AZURE_STORAGE_ACCOUNT" \
            --destination environment-monitor \
            --destination-path "$destination_path" \
            --source packages \
            --pattern "*.zip" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors \
            --output none

          echo "Upload completed. Uploaded blob paths:"
          printf '### Uploaded application ZIPs\n\nContainer: `environment-monitor`\n\nDestination: `%s`\n\n' "$destination_path" >> "$GITHUB_STEP_SUMMARY"
          for package in packages/*.zip; do
            blob_name="$destination_path/$(basename "$package")"
            echo "environment-monitor/$blob_name"
            printf -- '- `environment-monitor/%s`\n' "$blob_name" >> "$GITHUB_STEP_SUMMARY"
          done

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' || inputs.deploy == 'true'
    environment:
      name: "Production"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Function artifacts (WIN-X64)
        uses: actions/download-artifact@v4
        with:
          name: .env-monitor-function_x64
          path: "./env-monitor-function"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C8625311A7E41DF94B1F493E439AE3D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A9F03B52F6CA485B82924F1970E00D80 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4CE7A1599994A388FDDA5640CED3ECE }}

      - name: "Deploy HubObserver (Azure function)"
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: "EnvironmentMonitorHubObserver"
          slot-name: "Production"
          package: "./env-monitor-function"
